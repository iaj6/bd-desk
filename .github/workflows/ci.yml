name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — nothing here needs to finish twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every push gets checked, including branches, so you get a green tick before
# opening anything. Each job's `if` stops a same-repo pull request running a
# second, identical time — the push event already covered that commit. Pull
# requests from forks still run, because a fork's pushes never trigger workflows
# here, and a fork PR is exactly the case where you want the checks.

jobs:
  repo:
    name: Root (lint · typecheck · test)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The root suite covers crm/lib too, so crm's deps have to be present.
      - run: npm ci
        working-directory: crm
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  crm:
    name: CRM (lint · typecheck · build)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  demo:
    name: Demo mode boots with no credentials
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      # The promise the README makes to a first-time visitor: clone, install, run —
      # no API key, no Vercel account. Worth a job of its own, because it is the
      # thing most likely to quietly break and the last thing anyone would notice.
      - run: npm run seed:demo
      - name: Boot and check the board renders
        run: |
          BD_DESK_DEMO=1 npx next dev --port 3010 > /tmp/demo.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /tmp/demo.html http://localhost:3010/; then break; fi
            sleep 1
          done
          grep -q "Demo mode" /tmp/demo.html || { echo "::error::demo banner missing"; cat /tmp/demo.log; exit 1; }
          grep -q "Cascade Provisions Co." /tmp/demo.html || { echo "::error::seeded targets missing"; cat /tmp/demo.log; exit 1; }
          echo "demo mode booted and rendered the seeded board"
